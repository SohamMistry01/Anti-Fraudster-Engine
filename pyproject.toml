[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection project using ML and LLM agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "xgboost==3.4.1",
    "catboost==1.2.10",
    "langchain==1.4.7",
    "langgraph==1.2.16",
    "langchain-groq==1.1.3",
    "python-dotenv==1.2.4",
    "ipykernel==7.4.0",
    "lightgbm==4.7.0",
]

[tool.setuptools]
packages = []
